{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>registro</title>

    <link rel="stylesheet" href="{% static 'Ayala/estilos.css' %}">
</head>

<body>

    <!-- ENCABEZADO -->
    <header>
        <h1>Registra tus datos</h1>

        <!-- MENÚ DE NAVEGACIÓN -->
        <nav>
            <ul>
                <li><a href="inicio">Inicio</a></li>
                <li><a href="Registro">Registro</a></li>
                <li><a href="Taller">Taller</a></li>
                <li><a href="#">tres</a></li>
            </ul>
        </nav>
    </header>
<form action="{%url 'registro'%}" method="POST">
    {% csrf_token %}
    <label>Nombre:</label>
    <input type="text" name="nombre" placeholder="Escribe tu nombre..." required>
    <label>Apellido Materno:</label>
    <input type="text" name="apellidop" placeholder="Escribe tu apellido paterno..." required>
    <label>Apellido Paterno:</label>
    <input type="text" name="apellidom" placeholder="Escribe tu apellido materno...">
    <label>edad</label>
    <input type="number" name="edad" min="14" max="25" placeholder="Escribe tu edad..." required>
    <label>Genero:</label>
    <input type="radio" name="genero" value="Femenino">Femenino
    <input type="radio" name="genero" value="Masculino">Masculino<br><br>
    <label>Intereses:</label><br><br>
    <input type="checkbox" name="intereses" value="Futbol">Futbol
    <input type="checkbox" name="intereses" value="Musica">Musica
    <input type="checkbox" name="intereses" value="Video Juegos">Juegos
    <input type="checkbox" name="intereses" value="Salir a pasear">Salir a pasear
    <button type="submit">Guardar</button>

</form>
    <!-- PIE DE PÁGINA -->
    <footer>
        <p>Creado</p>
    </footer>

</body>
</html>
